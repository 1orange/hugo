name: Publish container images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names and version
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "app=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "ocr=ghcr.io/${repository}-ocr" >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and publish app and worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.images.outputs.app }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.app }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=hugo-app
          cache-to: type=gha,mode=max,scope=hugo-app
      - name: Build and publish OCR
        uses: docker/build-push-action@v6
        with:
          context: services/ocr
          file: services/ocr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.images.outputs.ocr }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.ocr }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=hugo-ocr
          cache-to: type=gha,mode=max,scope=hugo-ocr
