# Settings every app pod reads (web and worker). Secrets are in the
# `hugo-secrets` Secret — see secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hugo-config
  namespace: hugo
  labels:
    app.kubernetes.io/part-of: hugo
data:
  # The public URL: Auth.js callbacks and the Drive webhook.
  AUTH_URL: "https://hugo.example.eu"
  ALLOWED_EMAILS: "accountant@example.com"
  DRIVE_PARENT_FOLDER_ID: ""
  # Drive push (ADR 0020); empty = poll only.
  DRIVE_WEBHOOK_URL: "https://hugo.example.eu/api/drive/notifications"
  DRIVE_POLL_INTERVAL_MS: "900000"
  # The sidecars, as the workers reach them.
  EXTRACTOR_URL: "http://extractor:8080/v1"
  EXTRACTOR_MODEL: "local"
  # Documents read at once across all workers: the extractor's slots (-np).
  EXTRACTOR_CONCURRENCY: "1"
  OCR_URL: "http://ocr:8090"
  HUGO_REDIS_PREFIX: "hugo"
