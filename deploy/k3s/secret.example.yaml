# NOT applied by kustomization.yaml: a template. Create the real Secret
# without committing it, e.g.
#
#   kubectl -n hugo create secret generic hugo-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=AUTH_GOOGLE_ID=... \
#     --from-literal=AUTH_GOOGLE_SECRET=... \
#     --from-file=GOOGLE_SERVICE_ACCOUNT_JSON=./service-account.json
#
# The two passwords go into connection URLs: keep them URL-safe (hex).
apiVersion: v1
kind: Secret
metadata:
  name: hugo-secrets
  namespace: hugo
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-hex"
  REDIS_PASSWORD: "change-me-hex"
  AUTH_SECRET: "change-me"
  AUTH_GOOGLE_ID: "change-me"
  AUTH_GOOGLE_SECRET: "change-me"
  GOOGLE_SERVICE_ACCOUNT_JSON: "{}"
